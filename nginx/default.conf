server {
    listen 80;
    server_name ligamahasiswa.com www.ligamahasiswa.com;

    # Paksa semua traffic HTTP biasa untuk langsung pindah ke HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ligamahasiswa.com www.ligamahasiswa.com;

    root /var/www/public;
    index index.php index.html;

    # Sertifikat SSL dari Cloudflare Origin
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # Protokol keamanan modern
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Log Akses dan Eror (Opsional, mempermudah debug kedepannya)
    access_log /var/log/nginx/ligamahasiswa_access.log;
    error_log /var/log/nginx/ligamahasiswa_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        
        # 🌟 parameter krusial untuk memutus loop redirect 301 🌟
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_X_FORWARDED_PROTO https;
        fastcgi_param HTTP_X_FORWARDED_PORT 443;
    }

    # Blokir akses ke file rahasia seperti .env atau .git
    location ~ /\.ht {
        deny all;
    }
}