version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: web-lima-app
    container_name: web-lima-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage:/var/www/storage
      - ./bootstrap/cache:/var/www/bootstrap/cache
    networks:
      - webnet
    command: >
      sh -c "php artisan config:clear &&
             php artisan migrate --force || true &&
             php-fpm"

  web:
    image: nginx:stable-alpine
    container_name: web-lima-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Mount SSL cert
      - /etc/letsencrypt/live/ligamahasiswa.com/fullchain.pem:/etc/nginx/ssl/fullchain.pem:ro
      - /etc/letsencrypt/live/ligamahasiswa.com/privkey.pem:/etc/nginx/ssl/privkey.pem:ro
      # ACME challenge folder
      - ./certbot:/var/www/certbot
    depends_on:
      - app
    networks:
      - webnet

  db:
    image: mariadb:10.6
    container_name: web-lima-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: MyS3cur3P@ss
      MYSQL_DATABASE: web_lima
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - webnet

volumes:
  dbdata:

networks:
  webnet:
