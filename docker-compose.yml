version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: web-lima-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - webnet

  web:
    image: nginx:stable-alpine
    container_name: web-lima-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - webnet

  db:
    image: mariadb:10.6
    container_name: web-lima-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: l1m4
      MYSQL_DATABASE: web_lima
      MYSQL_USER: root
      MYSQL_PASSWORD: l1m4
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - webnet

volumes:
  dbdata:

networks:
  webnet: